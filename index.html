<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黄道十二星座</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            font-family: "SimSun", "Times New Roman", serif;
        }
        body {
            background: linear-gradient(135deg, #030308 0%, #0a0a20 50%, #050510 100%);
            cursor: grab; user-select: none;
        }
        body:active { cursor: grabbing; }
        canvas { display: block; position: fixed; top: 0; left: 0; }
        #details-panel {
            position: fixed; left: 30px; top: 50%; transform: translateY(-50%);
            width: 360px; max-width: 38vw; max-height: 88vh;
            background: rgba(8, 8, 30, 0.55);
            border: 2px solid rgba(255, 220, 140, 0.7);
            border-radius: 16px; padding: 28px;
            color: #ffd764; opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease; overflow-y: auto; z-index: 100;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 60px rgba(255, 215, 100, 0.35),
                        0 0 120px rgba(255, 180, 80, 0.15),
                        inset 0 0 80px rgba(255, 220, 140, 0.06);
        }
        #details-panel.visible { opacity: 1; pointer-events: auto; }
        #details-panel::-webkit-scrollbar { width: 6px; }
        #details-panel::-webkit-scrollbar-track { background: rgba(255, 215, 100, 0.05); border-radius: 3px; }
        #details-panel::-webkit-scrollbar-thumb { background: rgba(255, 215, 100, 0.4); border-radius: 3px; }
        .constellation-img {
            width: 140px; height: 140px; margin: 15px auto;
            display: block; border-radius: 50%;
            border: 3px solid rgba(255, 215, 100, 0.6);
            box-shadow: 0 0 30px rgba(255, 215, 100, 0.5),
                        inset 0 0 20px rgba(255, 215, 100, 0.15);
            background: radial-gradient(circle, rgba(20, 15, 40, 0.9), rgba(5, 5, 15, 0.95));
            display: flex; align-items: center; justify-content: center;
        }
        .constellation-img svg { width: 90px; height: 90px; filter: drop-shadow(0 0 10px rgba(255, 215, 100, 0.6)); }
        #details-panel h1 { font-size: 30px; margin-bottom: 8px; text-shadow: 0 0 20px rgba(255, 215, 100, 0.75); letter-spacing: 3px; }
        #details-panel h2 { font-size: 20px; margin-bottom: 15px; color: #fff; font-family: "Times New Roman", serif; font-style: italic; letter-spacing: 2px; }
        #details-panel .symbol { font-size: 52px; margin: 18px 0; text-align: center; text-shadow: 0 0 30px rgba(255, 215, 100, 1), 0 0 60px rgba(255, 180, 80, 0.4); }
        #details-panel .info-row { margin: 12px 0; padding: 10px 0; border-bottom: 1px solid rgba(255, 215, 100, 0.25); font-size: 16px; }
        #details-panel .label { color: #fff; font-weight: bold; text-shadow: 0 0 8px rgba(255, 215, 100, 0.4); }
        #details-panel .stars-section { margin: 18px 0; }
        #details-panel .stars-section h3 { font-size: 17px; margin-bottom: 12px; color: #fff; text-shadow: 0 0 8px rgba(255, 215, 100, 0.4); }
        #details-panel .stars-section ul { list-style: none; padding-left: 10px; }
        #details-panel .stars-section li { padding: 7px 0; font-size: 15px; text-shadow: 0 0 5px rgba(255, 215, 100, 0.3); }
        #details-panel .content-section { margin: 22px 0; }
        #details-panel .content-section h3 { font-size: 17px; margin-bottom: 10px; color: #fff; text-shadow: 0 0 8px rgba(255, 215, 100, 0.4); }
        #details-panel .content-section p { line-height: 1.9; font-size: 15px; text-shadow: 0 0 5px rgba(255, 215, 100, 0.25); }
        #close-btn {
            position: absolute; top: 12px; right: 15px;
            background: rgba(255, 215, 100, 0.15); border: 1px solid rgba(255, 215, 100, 0.45);
            color: #ffd764; font-size: 22px; cursor: pointer;
            border-radius: 50%; width: 34px; height: 34px;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(255, 215, 100, 0.2);
        }
        #close-btn:hover { background: rgba(255, 215, 100, 0.25); transform: scale(1.15); box-shadow: 0 0 25px rgba(255, 215, 100, 0.4); }
        #title {
            position: fixed; top: 25px; left: 50%; transform: translateX(-50%);
            color: #ffd764; font-size: 34px; z-index: 50; pointer-events: none;
            text-shadow: 0 0 30px rgba(255, 215, 100, 0.7), 0 0 60px rgba(255, 180, 80, 0.35);
            letter-spacing: 5px;
        }
        #subtitle {
            position: fixed; top: 75px; left: 50%; transform: translateX(-50%);
            color: rgba(255, 215, 100, 0.85); font-size: 16px;
            font-family: "Times New Roman", serif; z-index: 50; pointer-events: none;
            text-shadow: 0 0 15px rgba(255, 215, 100, 0.5);
            letter-spacing: 3px;
        }
        @media (max-width: 768px) {
            #details-panel { width: calc(100% - 40px); max-width: none; left: 20px; right: 20px; top: auto; bottom: 20px; transform: none; max-height: 48vh; }
            #title { font-size: 24px; }
            #subtitle { font-size: 14px; top: 62px; }
            .constellation-img { width: 120px; height: 120px; }
        }
    </style>
</head>

            {id:'aquarius',nameCn:'水瓶座',nameLat:'Aquarius',symbol:'♒',period:'1月20日 - 2月18日',element:'风象',rulingPlanet:'天王星',
             stars:[{cn:'危宿一',mag:2.9},{cn:'虚宿一',mag:3.0},{cn:'坟墓一',mag:3.3},{cn:'羽林军二十六',mag:3.5},{cn:'鈇鑕一',mag:3.9}],
             pattern:[[0.7,0.1],[0.6,0.25],[0.45,0.2],[0.4,0.4],[0.3,0.35],[0.2,0.5],[0.3,0.65],[0.5,0.55],[0.65,0.65]],
             intro:'水瓶座以持瓶者形象著称，与伽倪墨得斯的神话故事相关。',
             meaning:'象征独创、博爱、人道主义和理想。',
             svg:`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                 <path d="M30 20 Q50 15 70 20 L70 40 Q50 45 30 40 Z" fill="none" stroke="#ffd764" stroke-width="4"/>
                 <path d="M40 40 L40 50 L35 55 L40 60 L35 65 L40 70 L35 75 L40 80" fill="none" stroke="#ffd764" stroke-width="3"/>
                 <path d="M60 40 L60 50 L65 55 L60 60 L65 65 L60 70 L65 75 L60 80" fill="none" stroke="#ffd764" stroke-width="3"/>
                 <circle cx="40" cy="52" r="2" fill="#fff"/>
                 <circle cx="60" cy="52" r="2" fill="#fff"/>
                 <circle cx="50" cy="30" r="3" fill="#fff"/>
             </svg>`},
            {id:'pisces',nameCn:'双鱼座',nameLat:'Pisces',symbol:'♓',period:'2月19日 - 3月20日',element:'水象',rulingPlanet:'海王星',
             stars:[{cn:'外屏七',mag:3.6},{cn:'右更二',mag:3.6},{cn:'霹雳五',mag:4.0},{cn:'云雨一',mag:4.3},{cn:'奎宿一',mag:4.5}],
             pattern:[[0.1,0.7],[0.25,0.55],[0.2,0.35],[0.35,0.45],[0.5,0.3],[0.7,0.4],[0.6,0.55],[0.85,0.35],[0.9,0.55],[0.8,0.65]],
             intro:'双鱼座以两条相连的鱼为象征，代表爱与灵性的结合。',
             meaning:'象征敏感、艺术、直觉和慈悲。',
             svg:`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                 <ellipse cx="25" cy="30" rx="15" ry="10" fill="none" stroke="#ffd764" stroke-width="3"/>
                 <ellipse cx="75" cy="70" rx="15" ry="10" fill="none" stroke="#ffd764" stroke-width="3"/>
                 <path d="M40 30 Q50 50 60 70" fill="none" stroke="#ffd764" stroke-width="3"/>
                 <path d="M20 30 Q10 25 15 20 Q10 15 20 20 Q25 15 20 30" fill="none" stroke="#ffd764" stroke-width="3"/>
                 <path d="M80 70 Q90 65 85 60 Q90 55 80 60 Q75 55 80 70" fill="none" stroke="#ffd764" stroke-width="3"/>
                 <circle cx="22" cy="28" r="2" fill="#fff"/>
                 <circle cx="78" cy="68" r="2" fill="#fff"/>
             </svg>`}
        ];

        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        const mainCanvas = document.getElementById('mainCanvas');
        const mainCtx = mainCanvas.getContext('2d');
        const detailsPanel = document.getElementById('details-panel');
        const detailsContent = document.getElementById('details-content');
        const closeBtn = document.getElementById('close-btn');

        let W, H;
        let stars = [];
        let milkyWayOffset = 0;
        let rotationX = 0;
        let rotationY = 0;
        let targetRotX = 0;
        let targetRotY = 0;
        let rotationVelocityX = 0;
        let rotationVelocityY = 0;
        let isDragging = false;
        let lastX = 0;
        let lastY = 0;
        let selectedConstellation = null;
        let scale = 1;
        let targetScale = 1;
        let currentHitAreas = [];
        let animationTime = 0;

        function init() {
            W = window.innerWidth;
            H = window.innerHeight;
            bgCanvas.width = W;
            bgCanvas.height = H;
            mainCanvas.width = W;
            mainCanvas.height = H;
            generateStars();
        }

        function generateStars() {
            stars = [];
            const count = Math.floor((W * H) / 2000);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * W, y: Math.random() * H,
                    size: Math.random() * 3 + 0.8,
                    baseAlpha: Math.random() * 0.6 + 0.35,
                    phase: Math.random() * Math.PI * 2,
                    speed: Math.random() * 0.04 + 0.01,
                    twinkleSpeed: Math.random() * 0.07 + 0.02
                });
            }
        }

        function drawBackground() {
            const bgGrad = bgCtx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H));
            bgGrad.addColorStop(0, '#0a0a1a');
            bgGrad.addColorStop(0.4, '#050510');
            bgGrad.addColorStop(1, '#020208');
            bgCtx.fillStyle = bgGrad;
            bgCtx.fillRect(0, 0, W, H);

            const centerX = (milkyWayOffset + W * 0.25) % (W * 1.6) - W * 0.3;
            const centerY = H * 0.38;
            const milkyGradient = bgCtx.createRadialGradient(centerX, centerY, 0, centerX, centerY, W * 0.85);
            milkyGradient.addColorStop(0, 'rgba(140, 90, 200, 0.85)');
            milkyGradient.addColorStop(0.15, 'rgba(100, 60, 160, 0.7)');
            milkyGradient.addColorStop(0.35, 'rgba(70, 40, 120, 0.5)');
            milkyGradient.addColorStop(0.55, 'rgba(50, 25, 80, 0.35)');
            milkyGradient.addColorStop(0.75, 'rgba(30, 15, 50, 0.2)');
            milkyGradient.addColorStop(1, 'rgba(5, 5, 16, 0)');
            bgCtx.fillStyle = milkyGradient;
            bgCtx.fillRect(0, 0, W, H);

            for (let i = 0; i < 4; i++) {
                const bandY = centerY + (i - 1.5) * H * 0.12;
                const bandGrad = bgCtx.createLinearGradient(0, bandY - H * 0.12, 0, bandY + H * 0.12);
                bandGrad.addColorStop(0, 'rgba(70, 45, 130, 0)');
                bandGrad.addColorStop(0.5, `rgba(100, 60, 180, ${0.18 - i * 0.03})`);
                bandGrad.addColorStop(1, 'rgba(70, 45, 130, 0)');
                bgCtx.fillStyle = bandGrad;
                bgCtx.fillRect(0, bandY - H * 0.12, W, H * 0.24);
            }

            milkyWayOffset += 0.6;
            if (milkyWayOffset > W * 0.85) milkyWayOffset = 0;

            stars.forEach(star => {
                const twinkle = Math.sin(animationTime * star.twinkleSpeed + star.phase);
                const alpha = star.baseAlpha + twinkle * 0.25;
                const size = star.size * (1 + twinkle * 0.15);

                const glowGrad = bgCtx.createRadialGradient(star.x, star.y, 0, star.x, star.y, size * 2.5);
                glowGrad.addColorStop(0, `rgba(255, 250, 220, ${alpha * 0.7})`);
                glowGrad.addColorStop(0.4, `rgba(255, 220, 150, ${alpha * 0.35})`);
                glowGrad.addColorStop(0.8, `rgba(200, 150, 255, ${alpha * 0.15})`);
                glowGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                bgCtx.beginPath(); bgCtx.arc(star.x, star.y, size * 2.5, 0, Math.PI * 2);
                bgCtx.fillStyle = glowGrad; bgCtx.fill();

                bgCtx.beginPath(); bgCtx.arc(star.x, star.y, size, 0, Math.PI * 2);
                bgCtx.fillStyle = `rgba(255, 250, 230, ${alpha})`; bgCtx.fill();
            });
        }

        function project3D(x, y, z) {
            const cosX = Math.cos(rotationX), sinX = Math.sin(rotationX);
            const y1 = y * cosX - z * sinX, z1 = y * sinX + z * cosX;
            const cosY = Math.cos(rotationY), sinY = Math.sin(rotationY);
            const x1 = x * cosY - z1 * sinY, z2 = x * sinY + z1 * cosY;
            const fov = 600;
            const scale3D = fov / (fov + z2);
            const offsetX = W * 0.15;
            return { x: W / 2 + x1 * scale3D + offsetX, y: H / 2 + y1 * scale3D * 0.8, scale: scale3D, z: z2 };
        }

        function drawConstellation(constellation, baseAngle, isSelected) {
            const radius = Math.min(W, H) * 0.32;
            const x = Math.cos(baseAngle) * radius;
            const z = Math.sin(baseAngle) * radius;
            const proj = project3D(x, 0, z);
            const scaleMultiplier = isSelected ? scale : 1;
            const finalScale = proj.scale * scaleMultiplier;
            const constellationSize = 38 * finalScale;
            const textSize = 14 * finalScale;
            const baseColor = isSelected ? 'rgba(255, 230, 120,' : 'rgba(255, 215, 100,';
            const alpha = Math.min(0.95, finalScale * 0.9);

            if (constellation.pattern && constellation.pattern.length > 0) {
                mainCtx.beginPath();
                constellation.pattern.forEach((pt, i) => {
                    const px = proj.x + (pt[0] - 0.5) * constellationSize * 2;
                    const py = proj.y + (pt[1] - 0.5) * constellationSize * 2;
                    if (i === 0) mainCtx.moveTo(px, py);
                    else mainCtx.lineTo(px, py);
                });
                mainCtx.strokeStyle = `${baseColor}${Math.min(0.7, alpha * 0.8)})`;
                mainCtx.lineWidth = 2.5 * finalScale;
                mainCtx.stroke();

                constellation.pattern.forEach((pt, i) => {
                    const px = proj.x + (pt[0] - 0.5) * constellationSize * 2;
                    const py = proj.y + (pt[1] - 0.5) * constellationSize * 2;
                    const starInfo = constellation.stars[i % constellation.stars.length];
                    const starSize = starInfo ? Math.max(2, (5 - starInfo.mag * 0.5) * finalScale) : 2.5 * finalScale;
                    const twinkle = Math.sin(animationTime * (0.1 + i * 0.02));
                    const glowSize = starSize * (3 + twinkle);

                    const glowGrad = mainCtx.createRadialGradient(px, py, 0, px, py, glowSize);
                    glowGrad.addColorStop(0, `${baseColor}0.8)`);
                    glowGrad.addColorStop(0.4, `${baseColor}0.5)`);
                    glowGrad.addColorStop(0.7, 'rgba(200, 150, 255, 0.2)');
                    glowGrad.addColorStop(1, `${baseColor}0)`);
                    mainCtx.beginPath(); mainCtx.arc(px, py, glowSize, 0, Math.PI * 2);
                    mainCtx.fillStyle = glowGrad; mainCtx.fill();

                    mainCtx.beginPath(); mainCtx.arc(px, py, starSize, 0, Math.PI * 2);
                    mainCtx.fillStyle = `rgba(255, 250, 220, ${alpha})`; mainCtx.fill();
                });
            }

            if (finalScale > 0.2) {
                mainCtx.font = `${textSize}px SimSun`;
                mainCtx.fillStyle = `${baseColor}${alpha})`;
                mainCtx.textAlign = 'center';
                mainCtx.fillText(constellation.nameCn, proj.x, proj.y + constellationSize * 2.5);
                mainCtx.font = `${textSize * 0.85}px Times New Roman`;
                mainCtx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.85})`;
                mainCtx.fillText(constellation.nameLat, proj.x, proj.y + constellationSize * 2.5 + textSize + 5);
            }

            return { id: constellation.id, x: proj.x - constellationSize * 3, y: proj.y - constellationSize * 3, w: constellationSize * 6, h: constellationSize * 6 + textSize * 4, z: proj.z, inFront: proj.z > -400 };
        }

        function drawScene() {
            mainCtx.clearRect(0, 0, W, H);
            const drawOrder = constellations.map((c, i) => {
                const angle = (i / constellations.length) * Math.PI * 2 - Math.PI / 2;
                const radius = Math.min(W, H) * 0.32;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                const proj = project3D(x, 0, z);
                return { constellation: c, angle, z: proj.z };
            });

            drawOrder.sort((a, b) => a.z - b.z);
            const hitAreas = [];
            drawOrder.forEach(item => {
                const hitArea = drawConstellation(item.constellation, item.angle, selectedConstellation === item.constellation.id);
                if (hitArea && hitArea.inFront) hitAreas.push(hitArea);
            });

            return hitAreas;
        }

        function animate(timestamp) {
            animationTime = timestamp * 0.001;
            if (!isDragging) {
                rotationVelocityX *= 0.985;
                rotationVelocityY *= 0.985;
                targetRotX += rotationVelocityX;
                targetRotY += rotationVelocityY;
            }
            if (targetRotX > Math.PI * 0.4) targetRotX = Math.PI * 0.4;
            if (targetRotX < -Math.PI * 0.4) targetRotX = -Math.PI * 0.4;
            rotationX += (targetRotX - rotationX) * 0.08;
            rotationY += (targetRotY - rotationY) * 0.08;
            if (selectedConstellation) scale += (targetScale - scale) * 0.12;
            else scale += (1 - scale) * 0.1;
            drawBackground();
            currentHitAreas = drawScene();
            requestAnimationFrame(animate);
        }

        function handlePointerDown(e) { isDragging = true; lastX = e.clientX; lastY = e.clientY; }
        function handlePointerMove(e) {
            if (isDragging) {
                const dx = e.clientX - lastX, dy = e.clientY - lastY;
                rotationVelocityY = dx * 0.008; rotationVelocityX = dy * 0.005;
                targetRotY += rotationVelocityY; targetRotX += rotationVelocityX;
                lastX = e.clientX; lastY = e.clientY;
            }
            let hovering = false;
            const sortedAreas = [...currentHitAreas].sort((a, b) => b.z - a.z);
            for (const area of sortedAreas) {
                if (e.clientX >= area.x && e.clientX <= area.x + area.w && e.clientY >= area.y && e.clientY <= area.y + area.h) {
                    document.body.style.cursor = 'pointer';
                    hovering = true; break;
                }
            }
            if (!hovering) document.body.style.cursor = isDragging ? 'grabbing' : 'grab';
        }
        function handlePointerUp() { isDragging = false; }
        function handleClick(e) {
            if (Math.abs(rotationVelocityY) > 0.008 || Math.abs(rotationVelocityX) > 0.006) return;
            const sortedAreas = [...currentHitAreas].sort((a, b) => b.z - a.z);
            for (const area of sortedAreas) {
                if (e.clientX >= area.x && e.clientX <= area.x + area.w && e.clientY >= area.y && e.clientY <= area.y + area.h) {
                    showDetails(area.id);
                    return;
                }
            }
            hideDetails();
        }

        function showDetails(id) {
            const data = constellations.find(c => c.id === id);
            if (!data) return;
            selectedConstellation = id;
            targetScale = 1.7;
            detailsContent.innerHTML = `
                <div class="constellation-img">${data.svg}</div>
                <h1>${data.nameCn}</h1>
                <h2>${data.nameLat}</h2>
                <div class="symbol">${data.symbol}</div>
                <div class="info-row"><span class="label">日期：</span>${data.period}</div>
                <div class="info-row"><span class="label">元素：</span>${data.element}</div>
                <div class="info-row"><span class="label">守护星：</span>${data.rulingPlanet}</div>
                <div class="stars-section">
                    <h3>主要恒星</h3>
                    <ul>${data.stars.map(s => `<li>${s.cn} (视星等 ${s.mag})</li>`).join('')}</ul>
                </div>
                <div class="content-section">
                    <h3>简介</h3>
                    <p>${data.intro}</p>
                </div>
                <div class="content-section">
                    <h3>寓意</h3>
                    <p>${data.meaning}</p>
                </div>
            `;
            detailsPanel.classList.add('visible');
        }

        function hideDetails() {
            detailsPanel.classList.remove('visible');
            selectedConstellation = null;
            targetScale = 1;
        }

        mainCanvas.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);
        mainCanvas.addEventListener('click', handleClick);
        mainCanvas.addEventListener('touchstart', e => { e.preventDefault(); handlePointerDown(e.touches[0]); });
        window.addEventListener('touchmove', e => { e.preventDefault(); handlePointerMove(e.touches[0]); });
        window.addEventListener('touchend', e => {
            handlePointerUp();
            if (e.changedTouches.length > 0) handleClick(e.changedTouches[0]);
        });
        closeBtn.addEventListener('click', e => { e.stopPropagation(); hideDetails(); });
        window.addEventListener('resize', () => { init(); });

        init();
        requestAnimationFrame(animate);
    </script>
</body>
