<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黄道十二星座 - 简化版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(to bottom, #0a0a1a, #1a1a3a);
            font-family: "SimSun", "Times New Roman", serif;
            color: #ffd764;
            cursor: grab;
        }
        body:active { cursor: grabbing; }
        canvas { display: block; position: fixed; top: 0; left: 0; }
        #title {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            font-size: 32px; z-index: 50; pointer-events: none;
            text-shadow: 0 0 20px rgba(255, 215, 100, 0.5);
        }
        #subtitle {
            position: fixed; top: 75px; left: 50%; transform: translateX(-50%);
            font-size: 16px; font-family: "Times New Roman", serif;
            color: rgba(255, 215, 100, 0.7); z-index: 50; pointer-events: none;
        }
        #panel {
            position: fixed; left: 20px; top: 50%; transform: translateY(-50%);
            width: 300px; background: rgba(10, 10, 30, 0.85);
            border: 2px solid rgba(255, 215, 100, 0.5); border-radius: 15px;
            padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.5s;
            z-index: 100; max-height: 80vh; overflow-y: auto;
            backdrop-filter: blur(10px);
        }
        #panel.visible { opacity: 1; pointer-events: auto; }
        #panel h1 { font-size: 24px; margin-bottom: 5px; }
        #panel h2 { font-size: 18px; color: #fff; font-family: "Times New Roman"; font-style: italic; margin-bottom: 15px; }
        #panel .symbol { font-size: 40px; text-align: center; margin: 10px 0; text-shadow: 0 0 20px rgba(255, 215, 100, 0.8); }
        #panel .row { margin: 8px 0; padding: 6px 0; border-bottom: 1px solid rgba(255, 215, 100, 0.2); }
        #panel .label { color: #fff; font-weight: bold; }
        #panel .section { margin: 15px 0; }
        #panel .section h3 { font-size: 14px; color: #fff; margin-bottom: 8px; }
        #panel .section p { font-size: 13px; line-height: 1.6; }
        #close-btn { position: absolute; top: 8px; right: 12px; background: none; border: none; color: #ffd764; font-size: 20px; cursor: pointer; opacity: 0.7; }
        #close-btn:hover { opacity: 1; }
        @media (max-width: 768px) {
            #panel { width: calc(100% - 40px); left: 20px; right: 20px; top: auto; bottom: 20px; transform: none; max-height: 40vh; }
            #title { font-size: 24px; }
        }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    <canvas id="mainCanvas"></canvas>
    <div id="title">黄道十二星座</div>
    <div id="subtitle">The Twelve Zodiac Constellations</div>
    <div id="panel">
        <button id="close-btn">&times;</button>
        <div id="content"></div>
    </div>

    <script>
        const data = [
            {id:'aries',nameCn:'白羊座',nameLat:'Aries',symbol:'♈',period:'3月21日 - 4月19日',element:'火象星座',planet:'火星',intro:'白羊座是黄道十二星座的第一个星座，代表新的开始和初生的力量。',meaning:'象征勇气、活力和开创性。'},
            {id:'taurus',nameCn:'金牛座',nameLat:'Taurus',symbol:'♉',period:'4月20日 - 5月20日',element:'土象星座',planet:'金星',intro:'金牛座以公牛为象征，包含明亮的红巨星毕宿五。',meaning:'象征稳定、耐心和美感。'},
            {id:'gemini',nameCn:'双子座',nameLat:'Gemini',symbol:'♊',period:'5月21日 - 6月21日',element:'风象星座',planet:'水星',intro:'双子座以双胞胎为象征，代表双重性格和多样性。',meaning:'象征沟通、智慧和适应性。'},
            {id:'cancer',nameCn:'巨蟹座',nameLat:'Cancer',symbol:'♋',period:'6月22日 - 7月22日',element:'水象星座',planet:'月亮',intro:'巨蟹座以螃蟹为象征，包含著名的蜂巢星团。',meaning:'象征情感、家庭和保护。'},
            {id:'leo',nameCn:'狮子座',nameLat:'Leo',symbol:'♌',period:'7月23日 - 8月22日',element:'火象星座',planet:'太阳',intro:'狮子座以狮子为象征，是夏季星空中最壮观的星座之一。',meaning:'象征领导力和自信。'},
            {id:'virgo',nameCn:'处女座',nameLat:'Virgo',symbol:'♍',period:'8月23日 - 9月22日',element:'土象星座',planet:'水星',intro:'处女座以谷神为象征，是黄道十二星座中最大的星座。',meaning:'象征完美主义和实用性。'},
            {id:'libra',nameCn:'天秤座',nameLat:'Libra',symbol:'♎',period:'9月23日 - 10月23日',element:'风象星座',planet:'金星',intro:'天秤座以天平为象征，是唯一以无生命物体为象征的黄道星座。',meaning:'象征平衡、和谐和公正。'},
            {id:'scorpio',nameCn:'天蝎座',nameLat:'Scorpio',symbol:'♏',period:'10月24日 - 11月22日',element:'水象星座',planet:'冥王星',intro:'天蝎座以蝎子为象征，是夏季星空中最引人注目的星座之一。',meaning:'象征深度、热情和神秘。'},
            {id:'sagittarius',nameCn:'射手座',nameLat:'Sagittarius',symbol:'♐',period:'11月23日 - 12月21日',element:'火象星座',planet:'木星',intro:'射手座以人马弓箭手为象征，指向银河中心。',meaning:'象征冒险、自由和乐观。'},
            {id:'capricorn',nameCn:'摩羯座',nameLat:'Capricornus',symbol:'♑',period:'12月22日 - 1月19日',element:'土象星座',planet:'土星',intro:'摩羯座以海山羊为象征，是一个神话生物。',meaning:'象征自律、责任和坚韧。'},
            {id:'aquarius',nameCn:'水瓶座',nameLat:'Aquarius',symbol:'♒',period:'1月20日 - 2月18日',element:'风象星座',planet:'天王星',intro:'水瓶座以持瓶人为象征，在希腊神话中与美少年伽倪墨得斯有关。',meaning:'象征创新、独立和理想主义。'},
            {id:'pisces',nameCn:'双鱼座',nameLat:'Pisces',symbol:'♓',period:'2月19日 - 3月20日',element:'水象星座',planet:'海王星',intro:'双鱼座以两条鱼为象征，两条鱼被一条丝带系在一起。',meaning:'象征直觉、同情和灵性。'}
        ];

        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        const mainCanvas = document.getElementById('mainCanvas');
        const mainCtx = mainCanvas.getContext('2d');
        const panel = document.getElementById('panel');
        const content = document.getElementById('content');
        const closeBtn = document.getElementById('close-btn');

        let w, h, stars = [], offset = 0;
        let rotY = 0, targetRot = 0, velocity = 0, isDrag = false, lastX = 0;
        let selected = null, scale = 1, targetScale = 1;
        let hitAreas = [];

        function resize() {
            w = window.innerWidth;
            h = window.innerHeight;
            bgCanvas.width = w;
            bgCanvas.height = h;
            mainCanvas.width = w;
            mainCanvas.height = h;
            stars = [];
            for (let i = 0; i < Math.floor(w * h / 3000); i++) {
                stars.push({ x: Math.random() * w, y: Math.random() * h, size: Math.random() * 2 + 0.5, alpha: Math.random() * 0.5 + 0.3, phase: Math.random() * Math.PI * 2, speed: Math.random() * 0.02 + 0.01 });
            }
        }

        function drawBg(t) {
            bgCtx.fillStyle = '#0a0a1a';
            bgCtx.fillRect(0, 0, w, h);
            const grad = bgCtx.createLinearGradient(offset - w * 0.5, 0, offset + w * 1.5, 0);
            grad.addColorStop(0, 'rgba(10,10,30,0)');
            grad.addColorStop(0.3, 'rgba(30,20,60,0.4)');
            grad.addColorStop(0.5, 'rgba(60,40,100,0.6)');
            grad.addColorStop(0.7, 'rgba(30,20,60,0.4)');
            grad.addColorStop(1, 'rgba(10,10,30,0)');
            bgCtx.fillStyle = grad;
            bgCtx.fillRect(0, 0, w, h);
            offset += 0.2;
            if (offset > w) offset = 0;
            stars.forEach(s => {
                const a = s.alpha + Math.sin(t * s.speed + s.phase) * 0.3;
                bgCtx.beginPath();
                bgCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                bgCtx.fillStyle = `rgba(255,255,255,${a})`;
                bgCtx.fill();
            });
        }

        function project(x, y, z) {
            const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
            const newX = x * cosY - z * sinY;
            const newZ = x * sinY + z * cosY;
            const fov = 600;
            const s = fov / (fov + newZ);
            return { x: w / 2 + newX * s, y: h / 2 + y * s * 0.6, scale: s, z: newZ };
        }

        function draw(t) {
            mainCtx.clearRect(0, 0, w, h);
            const order = [];
            data.forEach((d, i) => {
                const angle = (i / data.length) * Math.PI * 2 - Math.PI / 2;
                const radius = Math.min(w, h) * 0.35;
                const p = project(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
                order.push({ d, i, z: p.z });
            });
            order.sort((a, b) => a.z - b.z);
            hitAreas = [];
            order.forEach(item => {
                const angle = (item.i / data.length) * Math.PI * 2 - Math.PI / 2;
                const radius = Math.min(w, h) * 0.35;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                const p = project(x, 0, z);
                if (p.z < -400) return;
                const mult = item.d.id === selected ? scale : 1;
                const s = p.scale * mult;
                const size = 25 * s;
                const txt = 12 * s;
                const color = `rgba(255,215,100,${Math.min(1, s * 0.8)})`;

                // Draw constellation lines (simplified V shape)
                mainCtx.beginPath();
                const points = [
                    { px: p.x + (-0.5 + item.i % 5 * 0.2) * size, py: p.y + (-0.3 + item.i % 3 * 0.2) * size },
                    { px: p.x + (item.i % 5 * 0.2) * size, py: p.y + (item.i % 4 * 0.15) * size },
                    { px: p.x + (0.5 + item.i % 5 * 0.2) * size, py: p.y + (-0.3 + item.i % 3 * 0.2) * size }
                ];
                points.forEach((pt, idx) => {
                    if (idx === 0) mainCtx.moveTo(pt.px, pt.py);
                    else mainCtx.lineTo(pt.px, pt.py);
                });
                mainCtx.strokeStyle = color;
                mainCtx.lineWidth = 1 * s;
                mainCtx.stroke();

                // Draw stars
                points.forEach(pt => {
                    const grad = mainCtx.createRadialGradient(pt.px, pt.py, 0, pt.px, pt.py, 6 * s);
                    grad.addColorStop(0, color);
                    grad.addColorStop(0.5, 'rgba(255,215,100,0.3)');
                    grad.addColorStop(1, 'rgba(255,215,100,0)');
                    mainCtx.beginPath();
                    mainCtx.arc(pt.px, pt.py, 6 * s, 0, Math.PI * 2);
                    mainCtx.fillStyle = grad;
                    mainCtx.fill();
                    mainCtx.beginPath();
                    mainCtx.arc(pt.px, pt.py, 2 * s, 0, Math.PI * 2);
                    mainCtx.fillStyle = '#fff';
                    mainCtx.fill();
                });

                if (s > 0.3) {
                    mainCtx.font = `${txt}px SimSun`;
                    mainCtx.fillStyle = color;
                    mainCtx.textAlign = 'center';
                    mainCtx.fillText(d.nameCn, p.x, p.y + size * 2);
                    mainCtx.font = `${txt * 0.8}px Times New Roman`;
                    mainCtx.fillStyle = `rgba(255,255,255,${Math.min(0.8, s * 0.7)})`;
                    mainCtx.fillText(d.nameLat, p.x, p.y + size * 2 + txt + 5);
                }

                if (p.z > -300) {
                    hitAreas.push({ id: d.id, x: p.x - size * 2, y: p.y - size * 2, w: size * 4, h: size * 4 + txt * 3, z: p.z });
                }
            });
        }

        function animate(t) {
            t *= 0.001;
            drawBg(t);
            if (!isDrag) {
                velocity *= 0.98;
                targetRot += velocity;
            }
            rotY += (targetRot - rotY) * 0.1;
            if (selected) scale += (targetScale - scale) * 0.1;
            draw(t);
            requestAnimationFrame(animate);
        }

        mainCanvas.addEventListener('mousedown', e => { isDrag = true; lastX = e.clientX; });
        window.addEventListener('mousemove', e => {
            if (isDrag) {
                const dx = e.clientX - lastX;
                velocity = dx * 0.005;
                targetRot += velocity;
                lastX = e.clientX;
            }
            let hover = false;
            [...hitAreas].sort((a, b) => b.z - a.z).forEach(h => {
                if (e.clientX >= h.x && e.clientX <= h.x + h.w && e.clientY >= h.y && e.clientY <= h.y + h.h) {
                    document.body.style.cursor = 'pointer';
                    hover = true;
                }
            });
            if (!hover) document.body.style.cursor = isDrag ? 'grabbing' : 'grab';
        });
        window.addEventListener('mouseup', () => isDrag = false);
        mainCanvas.addEventListener('click', e => {
            if (Math.abs(velocity) > 0.01) return;
            [...hitAreas].sort((a, b) => b.z - a.z).forEach(h => {
                if (e.clientX >= h.x && e.clientX <= h.x + h.w && e.clientY >= h.y && e.clientY <= h.y + h.h) {
                    const d = data.find(x => x.id === h.id);
                    selected = h.id;
                    targetScale = 1.8;
                    content.innerHTML = `<h1>${d.nameCn}</h1><h2>${d.nameLat}</h2><div class="symbol">${d.symbol}</div><div class="row"><span class="label">日期：</span>${d.period}</div><div class="row"><span class="label">元素：</span>${d.element}</div><div class="row"><span class="label">守护星：</span>${d.planet}</div><div class="section"><h3>简介</h3><p>${d.intro}</p></div><div class="section"><h3>寓意</h3><p>${d.meaning}</p></div>`;
                    panel.classList.add('visible');
                }
            });
        });

        closeBtn.addEventListener('click', e => { e.stopPropagation(); panel.classList.remove('visible'); selected = null; targetScale = 1; });
        window.addEventListener('resize', resize);
        resize();
        animate(0);
    </script>
</body>
</html>
